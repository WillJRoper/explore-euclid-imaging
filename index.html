<!doctype html>
<!--
  ============================================================================
  Euclid Image Explorer
  ============================================================================
  Interactive deep-zoom viewer for ESA Euclid survey imagery, built on
  OpenSeadragon.  The main view is a wide-field mosaic of the Euclid
  Deep Field; clickable hotspots let users drill into sub-regions at
  progressively higher resolution.

  Architecture
  ------------
  viewer.js   – Application logic (viewer init, hotspot rendering,
                image switching, idle-timer auto-return)
  regions.js  – YAML-based region/hotspot data loader
  regions.yaml – Hotspot definitions (pixel coords, target images, zoom)
  definitions.yaml – Image metadata (RA/Dec, area) for the hotspot
                     computation script

  Dependencies (loaded from CDN)
  - OpenSeadragon v4.0.0  – Deep-zoom tile renderer
  - js-yaml v4.1.0        – YAML parser (loaded by regions.js)
  - Hack Nerd Font        – Monospace UI font
  ============================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euclid Image Explorer</title>

  <!-- OpenSeadragon: deep-zoom tile viewer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.0.0/openseadragon.min.js"
    crossorigin="anonymous"></script>

  <!-- Hack Nerd Font for UI elements -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nerd-fonts/2.1.0/css/hack.css" />

  <style>
    /* ---- Reset & full-screen canvas ---- */

    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body,
    code,
    pre {
      font-family: "Hack Nerd Font", monospace;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    /* Smooth crossfade when switching between DZI images */
    .openseadragon-canvas {
      transition: opacity 0.1s ease;
    }

    /* Hide the default full-page toggle that OSD injects */
    .openseadragon-container.fullpage .openseadragon-fullpage-control {
      display: none !important;
    }

    :fullscreen .openseadragon-fullpage-control,
    :-webkit-full-screen .openseadragon-fullpage-control,
    :-ms-fullscreen .openseadragon-fullpage-control {
      display: none !important;
    }

    /* ---- Clickable hotspot markers ---- */

    .region-hotspot {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      z-index: 10000;

      /* Click-me icon (circular arrow badge) */
      background: url("clickMe-512px.png") no-repeat center center;
      background-size: contain;

      /* Hint to GPU for smoother transforms during pan/zoom */
      will-change: transform;

      /* Animate scale + glow on hover */
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .region-hotspot:hover {
      transform: scale(1.1);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
    }

    /* ---- Bottom-left back button ---- */

    #backMain {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      width: 52px;
      height: 52px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease,
                  transform 0.2s ease;
      z-index: 2000;
    }

    #backMain:hover {
      background: rgba(0, 0, 0, 0.85);
      transform: scale(1.05);
    }

    #backMain.hidden {
      display: none;
    }

    .back-arrow {
      width: 28px;
      height: 28px;
    }

    /* ---- Institutional logos ---- */

    #logoLeft {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      z-index: 2000;
    }

    #logoRight {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      z-index: 2000;
    }

    .logo {
      height: 10vh;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="viewer" style="position: relative">

    <!--
      Back-arrow button – visible only when viewing a sub-region.
      Clicking returns to the previous image in the navigation history.
    -->
    <button id="backMain" class="hidden" title="Back to main view">
      <svg class="back-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <!-- Glassy gradient for the arrow stroke -->
          <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.8)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0.4)" />
          </linearGradient>
          <!-- Soft outer glow -->
          <filter id="arrowGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <!-- Left-pointing chevron -->
        <path d="M15 6l-6 6 6 6" fill="none" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round" filter="url(#arrowGlow)" />
      </svg>
    </button>

    <!-- ES module entry point – deferred until DOM is ready -->
    <script type="module" src="viewer.js" defer></script>

    <!-- Institutional logos -->
    <div id="logoLeft">
      <a href="https://www.euclid-ec.org/" target="_blank" rel="noopener noreferrer">
        <img src="logos/EC_logos_official_white_with_text.png" alt="ESA/Euclid" class="logo" />
      </a>
    </div>
    <div id="logoRight">
      <a href="https://royalsociety.org/science-events-and-lectures/summer-science-exhibition/" target="_blank" rel="noopener noreferrer">
        <img src="logos/Royal_Society_logo.png" alt="Royal Society" class="logo" />
      </a>
    </div>

  </div>
</body>

</html>
