# ============================================================================
# Hotspot region definitions
# ============================================================================
# Each top-level key is an image identifier that corresponds to a DZI
# tileset directory (e.g. "main", "ngc_2188").  The value is a list of
# region definitions: clickable areas on that image that link to other
# DZI tilesets.
#
# Fields
# ------
# name          : Human-readable label for the hotspot.
# target        : Image key to switch to when clicked.
# ra / dec      : Celestial coordinate of the region centre (for reference).
# x_px / y_px   : Pixel coordinate relative to the *parent* image
#                 (origin at top-left).
# radius_px     : Approximate radius of the region in parent-image pixels.
# default_zoom  : Zoom level to apply when the target image opens.
# hotspot_size  : Diameter of the clickable UI element (CSS pixels).
#
# Hotspots can be generated automatically with compute_hotspots.py.
# ============================================================================

main:
  # Hotspots on the wide-field main mosaic.
  - name: extragalactic_patch
    target: extragalactic_patch
    ra: "06:12:50.65"
    dec: "-35:12:33.44"
    x_px: 14553
    y_px: 1837
    radius_px: 2394.8037972395
    default_zoom: 1.5
    hotspot_size: 128

  - name: abell_3381
    target: abell_3381
    ra: "06:10:05.23"
    dec: "-33:31:12.91"
    x_px: 11400.0
    y_px: 3600.0
    radius_px: 201.20376374574747
    default_zoom: 1.5                     # NB: Typo "deafult_zoom" in original
    hotspot_size: 128                     # is tolerated; default_zoom below is correct

  - name: ngc_2188
    target: ngc_2188
    ra: "06:10:01.48"
    dec: "-33:49:36.85"
    x_px: 12169
    y_px: 3360
    radius_px: 609.1746465505603
    default_zoom: 1.5
    hotspot_size: 128

  - name: Perseus
    target: perseus
    x_px: 6112
    y_px: 2099
    default_zoom: 1
    hotspot_size: 128

  - name: Euclid Deep Field South
    target: south_deep_field
    x_px: 18035
    y_px: 1107
    default_zoom: 1
    hotspot_size: 128

  - name: Einstein ring
    target: einstien_ring
    x_px: 7078
    y_px: 4334
    default_zoom: 1
    hotspot_size: 128

